<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin login | A la Mano</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    body {
      background: #f5f7ff;
    }

    .auth-shell {
      max-width: 500px;
      margin: 4rem auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0,0,0,.04);
    }

    .auth-shell h2 {
      margin-top: 0;
      font-size: 2rem;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .field label {
      font-weight: 700;
      color: #1f2937;
    }

    .field input {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #dfe3ec;
      border-radius: 10px;
      font-size: 1rem;
    }

    .alert {
      display: none;
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      background: linear-gradient(135deg, #111827, #374151);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .muted-link {
      display: block;
      margin-top: 1rem;
      text-align: center;
      color: #4f46e5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <h1 class="logo">A la Mano</h1>
      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="auth-shell">
      <h2>Admin login</h2>
      <p class="subtitle">Acceso exclusivo del administrador.</p>

      <div id="mensaje" class="alert"></div>

      <form id="loginAdminForm">
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" required placeholder="admin@ejemplo.com" />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required placeholder="Tu contraseña" />
        </div>

        <button type="submit" class="btn">Entrar al panel</button>
      </form>

      <a class="muted-link" href="index.html">Volver al inicio</a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">© 2026 A la Mano · Servicios en La Habana</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
