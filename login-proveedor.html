<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login proveedor | A la Mano</title>
  <link rel="stylesheet" href="css/styles.css" />

  <style>
    body {
      background: #f5f7ff;
    }

    .auth-shell {
      max-width: 500px;
      margin: 4rem auto;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .04);
    }

    .auth-shell h2 {
      margin-top: 0;
      font-size: 2rem;
    }

    .subtitle {
      color: #6b7280;
      margin-bottom: 1.5rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .field label {
      font-weight: 700;
      color: #1f2937;
    }

    .field input {
      width: 100%;
      padding: 0.9rem;
      border: 1px solid #dfe3ec;
      border-radius: 10px;
      font-size: 1rem;
      box-sizing: border-box;
    }

    .alert {
      display: none;
      margin-bottom: 1rem;
      padding: 0.85rem 1rem;
      border-radius: 10px;
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
    }

    .alert.success {
      background: #ecfdf5;
      color: #166534;
      border-color: #bbf7d0;
    }

    .btn {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 1rem;
      background: linear-gradient(135deg, #5a8dee, #7c4dff);
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }

    .muted-link {
      display: block;
      margin-top: 1rem;
      text-align: center;
      color: #4f46e5;
      font-weight: 600;
      cursor: pointer;
      border: none;
      background: transparent;
      width: 100%;
    }

    .recover-box {
      display: none;
      margin-top: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid #e5e7eb;
    }

    .recover-box h3 {
      margin-top: 0;
      color: #0d2b45;
    }
  </style>
</head>
<body>
  <nav class="navbar">
    <div class="container navbar-inner">
      <h1 class="logo">A la Mano</h1>

      <ul class="nav-links">
        <li><a href="index.html">Inicio</a></li>
        <li><a href="buscar.html">Buscar servicios</a></li>
        <li>
          <a href="registro-proveedor.html">
            Crear cuenta de proveedor
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <main class="container">
    <div class="auth-shell">
      <h2>Acceder como proveedor</h2>

      <p class="subtitle">
        Inicia sesión para publicar servicios y productos en el Mercado.
      </p>

      <div id="mensaje" class="alert"></div>

      <form id="loginProveedorForm">
        <div class="field">
          <label for="email">Correo electrónico</label>

          <input
            type="email"
            id="email"
            required
            placeholder="tuemail@ejemplo.com"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>

          <input
            type="password"
            id="password"
            required
            placeholder="Tu contraseña"
          />
        </div>

        <button type="submit" class="btn">
          Iniciar sesión
        </button>
      </form>

      <button
        type="button"
        id="btnRecuperarPassword"
        class="muted-link"
      >
        ¿Olvidaste tu contraseña?
      </button>

      <div id="recuperarPasswordBox" class="recover-box">
        <h3>Recuperar contraseña</h3>

        <div class="field">
          <label for="recoverEmail">Correo electrónico</label>
          <input
            type="email"
            id="recoverEmail"
            placeholder="tuemail@ejemplo.com"
          />
        </div>

        <div class="field">
          <label for="recoverKeyword">Palabra clave</label>
          <input
            type="text"
            id="recoverKeyword"
            placeholder="Escribe tu palabra clave"
          />
        </div>

        <div class="field">
          <label for="newPassword">Nueva contraseña</label>
          <input
            type="password"
            id="newPassword"
            placeholder="Mínimo 6 caracteres"
          />
        </div>

        <button
          type="button"
          id="submitRecoverPassword"
          class="btn"
        >
          Cambiar contraseña
        </button>
      </div>

      <a
        class="muted-link"
        href="registro-proveedor.html"
      >
        No tengo cuenta. Registrarme como proveedor
      </a>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      © 2026 A la Mano · Servicios en La Habana
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
